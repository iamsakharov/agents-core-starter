# Seed-шаблон GitHub Actions деплоя (agents-core).
# Скопируй в проект как .github/workflows/deploy.yml и адаптируй.
#
# Модель: push в main → сборка/проверка → деплой на сервер по SSH → пересборка контейнеров.
#
# Секреты задать в репо: Settings → Secrets and variables → Actions:
#   SSH_HOST        — ip или домен сервера
#   SSH_USER        — пользователь на сервере
#   SSH_KEY         — приватный SSH-ключ (весь файл, включая BEGIN/END)
#   DEPLOY_PATH     — путь к проекту на сервере, напр. /srv/app
# Никаких значений секретов в этом файле — только ссылки ${{ secrets.NAME }}.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # - run: npm test    # включи, когда появятся тесты

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s << 'REMOTE'
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
          REMOTE

      - name: Health check
        run: |
          # деплой не считается успешным, пока сервис не ответил
          for i in $(seq 1 10); do
            if curl -fsS "https://<ВАШ-ДОМЕН>/health" > /dev/null; then
              echo "healthy"; exit 0
            fi
            echo "waiting for service... ($i/10)"; sleep 5
          done
          echo "service did not become healthy"; exit 1
