name: Propagate agents-core

# Раздаёт слой agents-core по всем проектам из projects.json:
# на каждое изменение core открывает sync-PR в каждом downstream-репозитории.
#
# Требует секрет PROPAGATE_TOKEN — GitHub PAT (classic: scope `repo`, или
# fine-grained с Contents+Pull requests: write на целевые репо). GITHUB_TOKEN
# по умолчанию не может писать в чужие репозитории, поэтому нужен PAT.

# Сторонние actions запинены на commit SHA, а не на мутабельный тег: у job'а на руках
# PAT с записью в чужие репозитории, поэтому подмена тега = запись во все проекты.
# Обновлять пин осознанно, сверяясь с релизом апстрима.

on:
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "scripts/**"
  workflow_dispatch: {}

# GITHUB_TOKEN нужен только для чтения самого agents-core;
# запись в проекты идёт по PROPAGATE_TOKEN.
permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.load.outputs.projects }}
      count: ${{ steps.load.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - id: load
        env:
          CORE_OWNER: ${{ github.repository_owner }}
        run: |
          # Guard: раздаём слой только в репозитории владельца agents-core.
          # Рабочие, зеркальные и чужие репо не должны получать личный слой даже
          # по ошибке в реестре — фильтр здесь дублирует проверку в sync.sh.
          all=$(jq -r '.projects[]' projects.json)
          projects=$(jq -c --arg o "$CORE_OWNER" \
            '[.projects[] | select(startswith($o + "/"))]' projects.json)
          count=$(printf '%s' "$projects" | jq 'length')
          skipped=$(jq -r --arg o "$CORE_OWNER" \
            '.projects[] | select(startswith($o + "/") | not)' projects.json)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "В реестре: $(printf '%s\n' "$all" | grep -c . || true); к раздаче: $count"
          if [ -n "$skipped" ]; then
            echo "::warning::Пропущены репозитории вне владельца '$CORE_OWNER': $(printf '%s' "$skipped" | tr '\n' ' ')"
          fi

  propagate:
    needs: matrix
    if: ${{ needs.matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.matrix.outputs.projects) }}
    steps:
      - name: Checkout agents-core (источник)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          path: core

      - name: Checkout ${{ matrix.repo }} (цель)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.PROPAGATE_TOKEN }}
          path: target

      - name: Sync слой agents-core в проект
        env:
          AGENTS_CORE_SRC: ${{ github.workspace }}/core
        run: |
          bash "$AGENTS_CORE_SRC/scripts/sync.sh" "${{ github.workspace }}/target"

      - name: Открыть sync-PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          token: ${{ secrets.PROPAGATE_TOKEN }}
          path: target
          branch: agents-core-sync
          base: main
          commit-message: "chore: sync agents-core (${{ github.sha }})"
          title: "chore: sync agents-core"
          body: |
            Автоматическая раздача обновлённого слоя agents-core.

            Источник: ${{ github.repository }}@${{ github.sha }}

            Затронуты managed-файлы (`.claude/`, `CLAUDE.md`, `AGENTS.md`, `.mcp.json`).
            Локальные правила (`.claude/rules/local/`), `.claude/settings.local.json`
            и project-local секция `CLAUDE.md` не тронуты.
          delete-branch: true
